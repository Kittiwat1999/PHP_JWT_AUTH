<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/config.js"></script>
</head>
<body class="d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow" style="max-width:400px;width:100%;">
        <div class="card-body">
            <h3 class="card-title text-center mb-4">Dashboard</h3>
            <p id="welcome-message">Hi, Welcome to your dashboard!</p>
            <button class="btn btn-danger" onclick="logout()">Logout</button>
            <button class="btn btn-primary" onclick="getUser()">getUser</button>
        </div>
    </div>
</body>
<script src="js/fetch_data.js"></script>
<script>
    $(document).ready(function(){
        const token = localStorage.getItem("access_token");
        const AccessTokenExpiry = localStorage.getItem("access_token_expiry");
        now = (Math.floor(Date.now() / 1000));
        if(!token || now >= parseInt(AccessTokenExpiry)) {
            alert("Please login first!");
            window.location.href = "login.html";
        } else {
            $("#welcome-message").text(`Hi ${localStorage.getItem("username")}, Welcome to your dashboard!`);
            // Optionally, you can verify the token with the backend here
            // If invalid, clear localStorage and redirect to login
        }
    });

    function logout(){
        localStorage.clear();
        window.location.href = "login.html";
    }

    async function getUser(){
        try {
            const res = await fetchData("/public/get_user.php", "GET");
            alert("User data: " + JSON.stringify(res));
            console.log("User data: ", res);
        } catch (err) {
            alert("Error: " + err.message);
        }
    }
</script>
</html>
