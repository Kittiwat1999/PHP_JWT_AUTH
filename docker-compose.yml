version: "3.9"

services:

  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - ./mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - appnet

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: always
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    networks:
      - appnet
    depends_on:
      - db

  backend:
    build: ./backend
    container_name: php-backend
    ports:
      - "${BACKEND_PORT}:80"
    env_file:
      - .env
    volumes:
      - ./backend:/var/www/html   # mount โค้ด backend
    command: php -S 0.0.0.0:80 -t /var/www/html
    networks:
      - appnet
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: nginx-frontend
    ports:
      - "${FRONTEND_PORT}:80"
    env_file:
      - .env
    volumes:
      - ./frontend:/usr/share/nginx/html   # mount โค้ด frontend
    networks:
      - appnet

networks:
  appnet:
    driver: bridge
